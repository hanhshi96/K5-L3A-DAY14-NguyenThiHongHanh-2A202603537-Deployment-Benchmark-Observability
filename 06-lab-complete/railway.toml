# ============================================================
# Cấu hình deploy Railway (tiêu chí 12)
#   App lắng nghe theo biến PORT do Railway cấp (CMD trong Dockerfile dùng ${PORT:-8000})
#   Secret (AGENT_API_KEY) và REDIS_URL đặt bằng Railway Variables, không ghi ở đây.
# ============================================================
[build]
builder = "DOCKERFILE"          # build bằng Dockerfile của mình
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"     # Railway gọi /health để biết deploy thành công
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
