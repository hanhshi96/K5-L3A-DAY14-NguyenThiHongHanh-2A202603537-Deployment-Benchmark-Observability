# ============================================================
# Agent + Redis bằng một lệnh `docker compose up` (tiêu chí 2)
#   Secret (AGENT_API_KEY) đặt trong file .env — không commit
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0   # gọi Redis bằng tên service
    env_file:
      - path: .env                       # AGENT_API_KEY... đặt trong .env (không commit)
        required: false
    depends_on:
      redis:
        condition: service_healthy       # chờ Redis khoẻ mới bật agent
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  redis_data:
